name: xml

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This mod holds no code: there is nothing to compile. What can break is malformed XML, or a
# patch whose guard has gone missing.
jobs:
  xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Every XML file is well-formed
        run: find Mod -name '*.xml' -print0 | xargs -0 -r xmllint --noout

      # This mod guards itself with neither LoadFolders nor PatchOperationFindMod: every batch
      # is wrapped in a PatchOperationConditional testing for a def of the source mod. An
      # operation left unguarded would write a red error for anyone without that source.
      - name: Every patch file guards its operations
        run: |
          set -e
          bad=0
          for f in Mod/Patches/*.xml; do
            root=$(grep -c '^  <Operation ' "$f" || true)
            guarded=$(grep -c '^  <Operation Class="PatchOperationConditional">' "$f" || true)
            if [ "$root" != "$guarded" ]; then
              echo "::error file=$f::$root root operations, only $guarded of them guarded"
              bad=1
            fi
          done
          exit $bad
